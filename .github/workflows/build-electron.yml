name: 编译 Electron 应用

on:
  push:
    branches: [ test ]
  workflow_dispatch:

jobs:
  build:
    name: Build for ${{ matrix.identifier }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: windows-latest
            identifier: win-x64
            ext: .exe
          - os: macos-latest
            identifier: mac-arm64
            ext: ''
          - os: ubuntu-latest
            identifier: linux-x64
            ext: ''
    steps:
      - name: 拉取分支
        uses: actions/checkout@v4
        with:
            submodules: recursive

      - name: 设置 Nodejs
        uses: actions/setup-node@v4
        with:
            node-version: 20.x

      - name: 更新依赖
        run: yarn

      - name: 添加 git commit hash 到版本号
        if: matrix.os == 'windows-latest'
        run: |
            HASH=$(git rev-parse --short=7 HEAD)
            pwsh -Command "(Get-Content package.json) -replace '\"version\": \"([^\"]*)\"', ('\"version\": \"' + (`$matches[1] + '-$env:HASH') + '\"') | Set-Content package.json"
      - name: 添加 git commit hash 到版本号
        if: matrix.os == 'ubuntu-latest'
        run: |
            HASH=$(git rev-parse --short=7 HEAD)
            sed -i "s/\"version\": \"\([^\"]*\)\"/\"version\": \"\1-$HASH\"/" package.json
      - name: 添加 git commit hash 到版本号
        if: matrix.os == 'macos-latest'
        run: |
            HASH=$(git rev-parse --short=7 HEAD)
            sed -i '' "s/\"version\": \"\([^\"]*\)\"/\"version\": \"\1-$HASH\"/" package.json

      - name: 构建 stapxs-qq-lite-x
        run: yarn build:electron

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
            name: ${{ inputs.version }}-${{ matrix.os }}
            path: dist_electron
