name: 编译 Electron 应用

on:
  push:
    branches: [ test ]
  workflow_dispatch:

jobs:
  build:
    name: Build for ${{ matrix.identifier }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: windows-latest
            identifier: win-x64
          - os: macos-latest
            identifier: mac-arm64
          - os: ubuntu-latest
            identifier: linux-x64
    steps:
      - name: 拉取分支
        uses: actions/checkout@v4
        with:
            submodules: recursive

      - name: 设置环境变量
        run: |
            echo "VITE_HASH=$(git rev-parse --short=7 HEAD)" >> $GITHUB_ENV
            echo "VERSION=$(node -p "require('./package.json').version")" >> $GITHUB_ENV

      - name: 设置 Nodejs
        uses: actions/setup-node@v4
        with:
            node-version: 20.x

      - name: 更新依赖
        run: yarn

      - name: 安装 bsdtar(Linux)
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y libarchive-tools

      - name: 将 qqface 的软链接改成真实路径(win)
        if: matrix.os == 'windows-latest'
        run: |
            Remove-Item src/renderer/public/img/qqface
            Copy-Item src/renderer/src/assets/img/qq-face/public/assets/qq_emoji/resfile/emoji src/renderer/public/img/qqface -Recurse

      - name: 构建 stapxs-qq-lite-x
        run: yarn build:electron

      - name: 上传 Pacman 包
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
            name: stapxs-qq-lite-x-${{ env.VERSION }}-${{ env.VITE_HASH }}-${{ matrix.identifier }}.pacman
            path: dist_electron/*.pacman

      - name: 上传 AppImage 包
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
            name: stapxs-qq-lite-x-${{ env.VERSION }}-${{ env.VITE_HASH }}-${{ matrix.identifier }}.appimage
            path: dist_electron/*.AppImage

      - name: 上传 deb 包(amd64)
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
            name: stapxs-qq-lite-x-${{ env.VERSION }}-${{ env.VITE_HASH }}-${{ matrix.identifier }}-amd64.deb
            path: dist_electron/*_amd64.deb

      - name: 上传 deb 包(arm64)
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
            name: stapxs-qq-lite-x-${{ env.VERSION }}-${{ env.VITE_HASH }}-${{ matrix.identifier }}-arm64.deb
            path: dist_electron/*_arm64.deb

      - name: 上传 unpack 包(linux amd64)
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
            name: stapxs-qq-lite-x-${{ env.VERSION }}-${{ env.VITE_HASH }}-${{ matrix.identifier }}-amd64
            path: dist_electron/linux-unpacked

      - name: 上传 unpack 包(linux arm64)
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
            name: stapxs-qq-lite-x-${{ env.VERSION }}-${{ env.VITE_HASH }}-${{ matrix.identifier }}-arm64
            path: dist_electron/linux-arm64-unpacked

      - name: 上传 exe 包
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
            name: stapxs-qq-lite-x-${{ env.VERSION }}-${{ env.VITE_HASH }}-${{ matrix.identifier }}.exe
            path: dist_electron/*.exe

      - name: 上传 unpack 包(win)
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
            name: stapxs-qq-lite-x-${{ env.VERSION }}-${{ env.VITE_HASH }}-${{ matrix.identifier }}
            path: dist_electron/win-unpacked

      - name: 上传 dmg 包(amd64)
        if: matrix.os == 'macos-latest'
        uses: actions/upload-artifact@v4
        with:
            name: stapxs-qq-lite-x-${{ env.VERSION }}-${{ env.VITE_HASH }}-${{ matrix.identifier }}.dmg
            path: |
                dist_electron/*.dmg
                !dist_electron/*-arm64.dmg

      - name: 上传 dmg 包(arm64)
        if: matrix.os == 'macos-latest'
        uses: actions/upload-artifact@v4
        with:
            name: stapxs-qq-lite-x-${{ env.VERSION }}-${{ env.VITE_HASH }}-${{ matrix.identifier }}-arm64.dmg
            path: dist_electron/*-arm64.dmg
